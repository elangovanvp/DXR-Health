services:
  postgres:
    image: postgres:16-alpine
    container_name: dxr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dxr_health}
      POSTGRES_USER: ${POSTGRES_USER:-dxr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxr_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dxr_user} -d ${POSTGRES_DB:-dxr_health}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: dxr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dxr_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dxr_minio_secret_key_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dxr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dxr_health}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dxr_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dxr_secure_password_2026}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dxr_minio_admin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dxr_minio_secret_key_2026}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET_NAME:-dxr-xray-images}
      AI_ADAPTER_TYPE: ${AI_ADAPTER_TYPE:-mock}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dxr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "${PORT:-3000}:80"

volumes:
  postgres_data:
  minio_data:
